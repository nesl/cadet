# dataset.std.netem.dist: dataset x standalone x network:netem x distributed_hil.
extends: ../bases/_dataset.yaml
experiment: {name: acc_dataset_std_netem_dist}
nodes:
  - {name: dataset, host: localhost, role: client, device: cpu, launcher: docker}
  - {name: server, host: edge-host, port: 15341, role: server, device: cpu, gpu_index: 0, launcher: ssh_docker, user: cadet, ssh_identity: ~/.ssh/cadet_acceptance, container: cadet:dev}
links:
  - {name: uplink, from: dataset, to: server, direction: both,
     network: {mode: netem, distribution: {kind: lognormal, p50_ms: 8.0, p99_ms: 15.0}, loss: 0.0, bandwidth_mbps: 24.0}}
metrics: {collectors: [cpu, gpu, energy, bandwidth, clock_offset]}
