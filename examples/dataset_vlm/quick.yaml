# The quick config: one dataset node, the built-in VQA set, the stub model on
# the edge tier, the in-process delay backend. No download, no GPU and no
# simulator, so this is the config the unit test and CI run. ~seconds.
extends: _base.yaml

experiment: {name: dataset_vlm_quick, max_active_s: 120.0}

links:
  - name: uplink
    from: dataset
    to: server
    direction: both
    network:
      mode: delay
      distribution: {kind: lognormal, p50_ms: 8.0, p99_ms: 25.0}
      loss: 0.0
      bandwidth_mbps: 24.0
