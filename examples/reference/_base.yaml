# Shared base for the reference (non-AV) example. Extends the repo-wide base and
# defines the full client+server skeleton over a synthetic source. The concrete
# configs in this directory extend this file and override only their deltas.
extends: ../../configs/base.yaml

experiment: {name: reference, app: reference, repetitions: 1, seed: 0}
source: {kind: synthetic, count: 8, width: 64, height: 48}
models: {warmup: true}
nodes:
  - {name: client, host: localhost, role: client, device: cpu}
  - {name: server, host: 127.0.0.1, port: 15010, role: server, device: cpu}
channels:
  - {name: frames, from: client, to: server}
app: {plugin: reference, params: {model_kind: stub}}
