  # ===== netwaggle Wi-Fi cells (real Mininet-WiFi: stations on an AP) =====
  # A shared-medium cell: every node is a station on one access point (connectors:
  # cell_ap), shaped by the propagation model, not by a per-link qdisc. No `links`.
  # Run with `cadet emulate` inside the privileged Mininet-WiFi container, from
  # the host's own network namespace: mac80211_hwsim creates its radios in the
  # initial namespace, and a container with one of its own sees none of them.
  # One per source family (single_host).
  - {id: carla.std.nwwifi.sh,   source: carla,     processing: standalone, network: netwaggle_wifi, infra: single_host, status: valid, app: braking,     app_module: examples.braking.flat.app, config: tests/acceptance/cells/carla_std_nwwifi_sh.yaml, run_with: emulate}
  - {id: synth.std.nwwifi.sh,   source: synthetic, processing: standalone, network: netwaggle_wifi, infra: single_host, status: valid, app: reference,   app_module: examples.reference.app,    config: tests/acceptance/cells/synth_std_nwwifi_sh.yaml, run_with: emulate}
