# Vehicle-to-infrastructure (V2I) braking experiment (reproduces the default V2I run).
#
# What this is: an occluded ego approaches a crossing pedestrian. A roadside
# (infrastructure) camera plus the ego camera stream to an RSU server, which
# gates braking on time-to-collision. Default mode is baseline_local (ego frames
# only); the infra-camera pose lives in the V2I app defaults.
#
# How to use: `cadet validate configs/v2i_braking.yaml`.

experiment:
  name: v2i_braking
  app: v2i
  repetitions: 10
  seed: 0

source:
  kind: carla
  fps: 10
  camera:
    width: 800            # original ego camera = visualizer 800x600 (ROI depends on width)
    height: 600
    fov: 60.0             # EGO_FOV_DEG; the infra camera's 70 deg is in the app params
    mount_z: 1.6          # original V2I ego camera height (v2i_braking.py:160; braking/V2V use 1.8)
    queue_size: 5         # original ego_q/infra_q maxsize (v2i_braking.py:77-78; drop-newest)
  scenario:
    map: Town05
    name: V2IBrakingScenario_1
    definition: examples/v2i/scenarios/v2i_braking.py
    config_file: examples/v2i/scenarios/V2IBraking.xml
    ego_vehicle: audi.tt
    target_object: person
    ego_speed: 20mph
    ego_spawn: {x: -122.958664, y: 130.0, z: 0.6, yaw: -90.0}
    occluder:
      model: vehicle.carlamotors.carlacola
      spawn: {x: -105.958664, y: -70.0, z: 0.6, yaw: -90.0}
    pedestrian:
      spawn: {x: -110.0, y: -65.0, z: 0.6, yaw: 180.0}
      speed_mps: 2.0
      t_start_s: 15.3
    timeout_s: 600.0
    runner:
      path: /opt/scenario_runner   # override per run with --set source.scenario.runner.path=<dir>
      # The scenario driver runs in a container from this image, which
      # carries ScenarioRunner's pinned dependencies; the tree above is
      # mounted into it. Built by docker/Dockerfile (INSTALL_SIM=1).
      image: cadet:dev
  weather: clear          # clear | light | high (passed to the scenario as CADET_V2I_WEATHER)

  carla:
    image: carlasim/carla:0.9.10.1
    gpu_index: 1
    quality: Low
    offscreen: true
    client_egg:
      name: carla-0.9.10-py3.7-linux-x86_64.egg
    port: 2000
    timeout: 10
models:
  detector: yolo
  tracker: sort
  predictor: linear
  model: yolo11x
  # Device is derived from the server node that hosts the model (device: gpu).
  registry:
    yolo11x:
      per_device:
        gpu: yolo11x.pt
        edge: yolo11x.engine
        hailo: yolo11x.hef
    coco_labels:
      per_device:
        gpu: coco.names
        edge: coco.names
        hailo: coco.names

nodes:
  - name: client
    host: localhost
    launcher: local
    role: client
    device: cpu
  - name: server
    host: localhost
    port: 11000
    launcher: local
    role: server
    device: gpu
    # Match the original RSU per-device inbound queue (maxsize=10, BLOCKING put):
    # when 10 frames are pending the server stops reading, TCP backpressure
    # throttles the client, and the client drops its newest camera frame. This
    # reproduces the original's contiguous-FIFO behaviour (no stale pileup) rather
    # than CADET's default unbounded inbound queue.
    inbound_block_at: 10

channels:
  - name: ego_frames
    from: client
    to: server
    max_queue: 2
    send_meta: false
    stop_on_brake: true
    device_id: ego
  - name: infra_frames
    from: client
    to: server
    max_queue: 2
    send_meta: false
    stop_on_brake: true
    device_id: infra

links: []

app:
  plugin: v2i              # infra camera pose / ROI / TTC use the V2I defaults
  params:
    # The four modes (set with --set app.params.mode=<mode>):
    #   baseline_local  - ego camera only, no network hop (the default).
    #   baseline_cloud  - ego only, a 50 ms ego->RSU hop.
    #   v2i_local       - ego + infra cameras, no network hop.
    #   v2i_external    - ego + infra, a 50 ms infra->RSU hop.
    # In the v2i modes the one client opens a second connection and streams the fixed
    # roadside camera; in the baseline modes it streams the ego camera only. The two
    # 50 ms hops default to blocking server sleeps (hop_mode: blocking, the original's
    # mechanism); set hop_mode: link to model them as config links instead. Default
    # 50 ms matches the original; the paper cites 30 ms.
    mode: baseline_local

outputs:
  root: outputs
  naming: "{experiment}/{app}/{run_id}"
  save: []
